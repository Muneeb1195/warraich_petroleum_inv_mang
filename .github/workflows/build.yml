name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'

      - name: Generate app_config.dart
        run: |
          mkdir -p lib/config
          cat > lib/config/app_config.dart << 'DART'
          class AppConfig {
            static const String googleClientId = String.fromEnvironment(
              'GOOGLE_CLIENT_ID',
              defaultValue: '${{ secrets.GOOGLE_CLIENT_ID }}',
            );
            static const String googleClientSecret = String.fromEnvironment(
              'GOOGLE_CLIENT_SECRET',
              defaultValue: '${{ secrets.GOOGLE_CLIENT_SECRET }}',
            );
          }
          DART

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'

      - name: Generate app_config.dart
        run: |
          mkdir -p lib/config
          cat > lib/config/app_config.dart << 'DART'
          class AppConfig {
            static const String googleClientId = String.fromEnvironment(
              'GOOGLE_CLIENT_ID',
              defaultValue: '${{ secrets.GOOGLE_CLIENT_ID }}',
            );
            static const String googleClientSecret = String.fromEnvironment(
              'GOOGLE_CLIENT_SECRET',
              defaultValue: '${{ secrets.GOOGLE_CLIENT_SECRET }}',
            );
          }
          DART

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Linux Desktop
        run: flutter build linux --release

      - name: Package Linux Build
        run: tar -czf linux-desktop.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Build to Release
        uses: softprops/action-gh-release@v2
        with:
          files: linux-desktop.tar.gz
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: 'stable'

      - name: Generate app_config.dart
        shell: bash
        run: |
          mkdir -p lib/config
          cat > lib/config/app_config.dart << 'DART'
          class AppConfig {
            static const String googleClientId = String.fromEnvironment(
              'GOOGLE_CLIENT_ID',
              defaultValue: '${{ secrets.GOOGLE_CLIENT_ID }}',
            );
            static const String googleClientSecret = String.fromEnvironment(
              'GOOGLE_CLIENT_SECRET',
              defaultValue: '${{ secrets.GOOGLE_CLIENT_SECRET }}',
            );
          }
          DART

      - name: Install dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build Windows Desktop
        run: flutter build windows --release

      - name: Upload Windows Build to Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/windows/x64/runner/Release/warraich_petroleum.exe
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
